name: refresh

# The landing page says it only states values that can be checked on chain.
# Hard-coded numbers drift from reality over time, and the worst case is when they
# drift in our favour. So we re-read and refresh them daily.
#
# The repository is public, so Actions minutes are not metered.

on:
  schedule:
    # Daily at 00:20 UTC (09:20 KST). Off the hour, to avoid scheduler congestion.
    - cron: "20 0 * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # _build.py exits 1 when the on-chain query fails. The output would then hold
      # the old values, so we commit nothing and let the run fail. Skipping a deploy
      # beats shipping stale numbers dressed up as fresh ones.
      - name: Query chain and regenerate
        run: python3 _build.py

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html ko/index.html sitemap.xml; then
            echo "no change — skipping commit"
            exit 0
          fi

          git config user.name  "DURE Nodes"
          git config user.email "313475351+durenodes@users.noreply.github.com"
          git add index.html ko/index.html sitemap.xml robots.txt
          git commit -m "Refresh on-chain figures ($(date -u +%Y-%m-%d))"
          git push

      # Cloudflare Pages picks up the push to main and deploys on its own.
      # No separate deploy step is needed.
