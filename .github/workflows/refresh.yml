name: refresh

# 랜딩 페이지는 "온체인에서 그대로 확인할 수 있는 값만 적는다"고 말합니다.
# 값이 박혀 있으면 시간이 지나며 실제와 벌어지고, 그 방향이 유리한 쪽일 때
# 가장 나쁩니다. 매일 다시 읽어 갱신합니다.
#
# 저장소가 공개라 Actions 사용량 제한이 없습니다.

on:
  schedule:
    # 매일 00:20 UTC (09:20 KST). 정각을 피해 스케줄 혼잡을 줄입니다.
    - cron: "20 0 * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # _build.py 는 온체인 조회에 실패하면 종료 코드 1 을 돌려줍니다.
      # 그 경우 결과물은 옛 값이므로 커밋하지 않고 실패로 남깁니다.
      # 낡은 값을 새 값인 척 배포하는 것보다 배포를 건너뛰는 편이 낫습니다.
      - name: 온체인 조회 및 재생성
        run: python3 _build.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- index.html ko/index.html sitemap.xml; then
            echo "변화 없음 — 커밋 생략"
            exit 0
          fi

          git config user.name  "DURE Nodes"
          git config user.email "313475351+durenodes@users.noreply.github.com"
          git add index.html ko/index.html sitemap.xml robots.txt
          git commit -m "Refresh on-chain figures ($(date -u +%Y-%m-%d))"
          git push

      # Cloudflare Pages 가 main 푸시를 감지해 자동 배포합니다.
      # 별도 배포 단계가 필요 없습니다.
